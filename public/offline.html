<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0ea5e9" />
    <meta name="description" content="FinSight AI - Offline Mode" />
    <title>FinSight AI - Offline</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background-color: #0f172a;
        color: #f1f5f9;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }

      .container {
        max-width: 480px;
        width: 100%;
        text-align: center;
      }

      .logo {
        width: 80px;
        height: 80px;
        margin: 0 auto 1.5rem;
        background: linear-gradient(135deg, #0ea5e9 0%, #3b82f6 100%);
        border-radius: 1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        font-weight: bold;
        color: white;
      }

      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 0.75rem;
        color: #f1f5f9;
      }

      p {
        color: #94a3b8;
        margin-bottom: 1.5rem;
        line-height: 1.6;
      }

      .retry-button {
        display: inline-block;
        background: linear-gradient(135deg, #0ea5e9 0%, #3b82f6 100%);
        color: white;
        padding: 0.75rem 1.5rem;
        border-radius: 0.5rem;
        text-decoration: none;
        font-weight: 500;
        transition: transform 0.2s ease;
      }

      .retry-button:hover {
        transform: scale(1.05);
      }

      .retry-button:active {
        transform: scale(0.95);
      }

      .features {
        margin-top: 2.5rem;
        display: flex;
        justify-content: center;
        gap: 2rem;
        flex-wrap: wrap;
      }

      .feature {
        flex: 1;
        min-width: 120px;
      }

      .feature-icon {
        width: 40px;
        height: 40px;
        margin: 0 auto 0.75rem;
        background: rgba(14, 165, 233, 0.1);
        border-radius: 0.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #0ea5e9;
        font-size: 1.25rem;
      }

      .feature-title {
        font-size: 0.875rem;
        font-weight: 600;
        color: #f1f5f9;
        margin-bottom: 0.25rem;
      }

      .feature-desc {
        font-size: 0.75rem;
        color: #94a3b8;
      }

      .footer {
        margin-top: 3rem;
        color: #64748b;
        font-size: 0.75rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo">F</div>
      <h1>You're Offline</h1>
      <p>
        FinSight AI needs an internet connection to fetch the latest financial data.
        Please check your connection and try again.
      </p>
      <a href="/" class="retry-button" onclick="event.preventDefault(); window.location.reload();">
        Try Again
      </a>

      <div class="features">
        <div class="feature">
          <div class="feature-icon">&#x1F4CA;</div>
          <div class="feature-title">Portfolio</div>
          <div class="feature-desc">View cached data</div>
        </div>
        <div class="feature">
          <div class="feature-icon">&#x1F4E4;</div>
          <div class="feature-title">Sync</div>
          <div class="feature-desc">Auto-sync when online</div>
        </div>
        <div class="feature">
          <div class="feature-icon">&#x1F4F1;</div>
          <div class="feature-title">Mobile</div>
          <div class="feature-desc">Install the app</div>
        </div>
      </div>

      <div class="footer">
        &copy; 2024 FinSight AI. All rights reserved.
      </div>
    </div>
  </body>
</html>
