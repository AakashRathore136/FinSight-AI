name: Container Security Scan

on:
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'api/**'
      - '.github/workflows/container-security.yml'
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'api/**'
      - '.github/workflows/container-security.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write

env:
  IMAGE_NAME: finsight-ai
  IMAGE_TAG: ci-scan
  # Trivy will fail the workflow if vulnerabilities at or above this
  # severity are found. Adjust as the project's security posture matures.
  SEVERITY_THRESHOLD: CRITICAL

jobs:
  build-and-scan:
    name: Build image and scan for vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Image is built locally only. It is never pushed to a registry.
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner (SARIF report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-results.sarif
          severity: LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'

      - name: Upload SARIF report to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Run Trivy vulnerability scanner (table summary)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: table
          output: trivy-results.txt
          severity: LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'

      - name: Publish scan results to job summary
        if: always()
        run: |
          {
            echo "## Container Vulnerability Scan Results"
            echo ""
            echo "Image scanned: \`${IMAGE_NAME}:${IMAGE_TAG}\`"
            echo "Fail threshold: **${SEVERITY_THRESHOLD}**"
            echo ""
            echo '```'
            cat trivy-results.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-scan-results
          path: |
            trivy-results.sarif
            trivy-results.txt
          retention-days: 30

      # This step actually enforces the security gate: it fails the
      # workflow if any vulnerability at or above SEVERITY_THRESHOLD
      # is found. It runs after the report steps above so that the
      # summary and SARIF upload always happen, even on failure.
      - name: Enforce severity threshold
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: table
          severity: ${{ env.SEVERITY_THRESHOLD }}
          ignore-unfixed: false
          exit-code: '1'