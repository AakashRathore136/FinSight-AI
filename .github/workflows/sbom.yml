name: SBOM & Build Provenance

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'yarn.lock'
      - 'pnpm-lock.yaml'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - '**/poetry.lock'
      - '.github/workflows/sbom.yml'

  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'yarn.lock'
      - 'pnpm-lock.yaml'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - '**/poetry.lock'
      - '.github/workflows/sbom.yml'

  release:
    types: [published]

  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 
        with:
          fetch-depth: 0

      # ---- Phase 1: SBOM Generation ----
      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c 
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: false

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c 
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      # ---- Phase 2: Artifact Management ----
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 
        with:
          name: sbom-${{ github.sha }}
          path: |
            sbom.cyclonedx.json
            sbom.spdx.json
          retention-days: 90
          if-no-files-found: error

      # ---- Phase 3: Build Provenance ----
      # Only for code that actually ships: pushes to main and releases.
      # Skipped on pull_request — fork PRs can't be granted the OIDC
      # token needed to sign an attestation, and provenance for
      # unmerged code isn't meaningful anyway.
      - name: Generate build provenance attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 
        with:
          subject-path: |
            sbom.cyclonedx.json
            sbom.spdx.json

      - name: Summarize run
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            provenance="signed via actions/attest-build-provenance (Sigstore/SLSA)"
          else
            provenance="skipped (PR run — provenance is generated on merge to main/release)"
          fi
          {
            echo "### SBOM & Provenance Summary"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- SBOM formats: CycloneDX JSON, SPDX JSON"
            echo "- Provenance: ${provenance}"
          } >> "$GITHUB_STEP_SUMMARY"
