name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'api/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.*'
      - 'eslint.config.*'
      - '.eslintrc*'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'api/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.*'
      - 'eslint.config.*'
      - '.eslintrc*'
      - '.github/workflows/ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  
jobs:
  quality:
    name: Type Check · Lint · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 

      - name: Setup Node.js 18
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 
        with:
          node-version: '18'
          package-manager: npm
          install-dependencies: 'true'
          install-retries: '3'
          cache: 'true'
          cache: 'npm'

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            echo "npm ci attempt ${attempt}/3"

            if npm ci; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "npm ci failed; retrying in 10 seconds..."
              sleep 10
            fi
          done

          echo "npm ci failed after 3 attempts."
          exit 1

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}

  node-compatibility:
    name: Node.js ${{ matrix.node-version }} Compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18', '20', '22']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
      - name: CI Job Summary
        if: always()
        run: |
          {
            echo "## CI Job Summary"
            echo ""
            echo "- **Workflow:** ${{ github.workflow }}"
            echo "- **Run:** #${{ github.run_number }}"
            echo "- **Node.js:** $(node --version)"
            echo "- **npm:** $(npm --version)"
            echo "- **Overall result:** ${{ job.status }}"
            echo ""
            echo "### CI Stages"
            echo "- Type Check → See workflow step result"
            echo "- Lint → See workflow step result"
            echo "- Build → See workflow step result"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Failure Diagnostics
        if: failure()
        run: |
          {
            echo "## CI Failure Diagnostics"
            echo ""
            echo "CI failed. Review the failed workflow step above for the exact error."
            echo ""
            echo "### Environment"
            echo "- **Node.js:** $(node --version)"
            echo "- **npm:** $(npm --version)"
            echo "- **Runner:** $RUNNER_OS"
            echo ""
            echo "### Troubleshooting"
            echo "- Check dependency installation errors first."
            echo "- Check TypeScript output for type-check failures."
            echo "- Check lint output for code-quality failures."
            echo "- Check build output for production build failures."
            echo ""
            echo "No secrets or sensitive environment variables are included."
          } >> "$GITHUB_STEP_SUMMARY"
