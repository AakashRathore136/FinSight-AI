name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Type Check · Lint · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js 18
        uses: actions/setup-node@v7
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint
        # If no lint script exists yet, this step will fail gracefully
        # and remind maintainers to add it — see notes in PR

      - name: Build
        run: npm run build
        env:
          # These secrets must be added in GitHub → Settings → Secrets → Actions
          # For PRs from forks, build runs without real keys (Vite still builds
          # as long as env vars are defined, even if empty)
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}

      - name: CI Job Summary
        if: always()
        run: |
          {
            echo "## CI Job Summary"
            echo ""
            echo "- **Workflow:** ${{ github.workflow }}"
            echo "- **Run:** #${{ github.run_number }}"
            echo "- **Node.js:** $(node --version)"
            echo "- **npm:** $(npm --version)"
            echo "- **Overall result:** ${{ job.status }}"
            echo ""
            echo "### CI Stages"
            echo "- Type Check → See workflow step result"
            echo "- Lint → See workflow step result"
            echo "- Build → See workflow step result"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Failure Diagnostics
        if: failure()
        run: |
          {
            echo "## CI Failure Diagnostics"
            echo ""
            echo "CI failed. Review the failed workflow step above for the exact error."
            echo ""
            echo "### Environment"
            echo "- **Node.js:** $(node --version)"
            echo "- **npm:** $(npm --version)"
            echo "- **Runner:** $RUNNER_OS"
            echo ""
            echo "### Troubleshooting"
            echo "- Check dependency installation errors first."
            echo "- Check TypeScript output for type-check failures."
            echo "- Check lint output for code-quality failures."
            echo "- Check build output for production build failures."
            echo ""
            echo "No secrets or sensitive environment variables are included."
          } >> "$GITHUB_STEP_SUMMARY"